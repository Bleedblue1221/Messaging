name: Sync Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest release
        id: upstream
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/GrapheneOS/Messaging/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release data
        id: release
        run: |
          echo '${{ steps.upstream.outputs.data }}' > release.json

          echo "tag_name=$(jq -r '.tag_name' release.json)" >> $GITHUB_OUTPUT
          echo "name<<EOF" >> $GITHUB_OUTPUT
          jq -r '.name' release.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          jq -r '.body' release.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: exists
        run: |
          if gh release view "${{ steps.release.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create matching release
        if: steps.exists.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.release.outputs.tag_name }}" \
            --title "${{ steps.release.outputs.name }}" \
            --notes "${{ steps.release.outputs.body }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
